
spring.application.name=ipt-tracker

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ipt_tracker}
spring.datasource.username=${DB_USERNAME:ipt}
spring.datasource.password=${DB_PASSWORD:ipt}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

ipt.jwt.secret=${JWT_SECRET}
ipt.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
